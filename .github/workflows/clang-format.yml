name: clang-format

on:
  push:
  pull_request:

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - name: Install clang-format
      run: pip install clang-format==20.1.1
    - name: Check formatting
      shell: bash
      run: |
        set -euo pipefail
        echo "--- clang-format info ---"
        which clang-format
        clang-format --version
        cat .clang-format
        echo "--- Diff check ---"
        status=0
        for f in $(find paliwa/ test/ \( -name '*.hpp' -o -name '*.cpp' \) | sort); do
          if ! diff -u "$f" <(clang-format "$f"); then
            echo "FAIL: $f needs formatting"
            status=1
          fi
        done
        exit $status
