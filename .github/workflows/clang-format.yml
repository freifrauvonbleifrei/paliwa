name: clang-format

on:
  push:
  pull_request:

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - name: Install clang-format
      run: pip install clang-format==19.1.7
    - name: Check formatting
      run: |
        set -x
        which clang-format
        clang-format --version
        cat .clang-format
        echo "--- Files to check ---"
        find paliwa/ test/ \( -name '*.hpp' -o -name '*.cpp' \) | sort
        echo "--- Running clang-format ---"
        find paliwa/ test/ \( -name '*.hpp' -o -name '*.cpp' \) \
          -exec clang-format --dry-run --Werror --verbose {} +
        echo "--- Diff check ---"
        find paliwa/ test/ \( -name '*.hpp' -o -name '*.cpp' \) -print0 | \
          xargs -0 -I{} sh -c 'diff -u "{}" <(clang-format "{}") || exit 1'
