name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  
jobs:
  build:
    name: build-and-test (MPI ${{ matrix.mpi }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mpi:         [yes, no]
        build_type:  [Release, Debug]
      fail-fast: false
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    # cf. https://github.com/spack/setup-spack
    - name: Set up Spack
      uses: spack/setup-spack@5ab3c91bdefffffad9a7e45d1d156146afebb3a7
      with:
        ref: v1.1.1      # Spack version (examples: develop, releases/v0.23)
        buildcache: true  # Configure oci://ghcr.io/spack/github-actions-buildcache
        color: true       # Force color output (SPACK_COLOR=always)
        path: spack       # Where to clone Spack
    - name: Install system dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc gfortran python3
    - name: Set up ddc-env
      shell: spack-bash {0}
      run: |
        spack compiler find
        spack external find
        spack config add "packages:cmake:buildable:false"
        spack config add "packages:python:buildable:false"
        GCC_FULL_VER=$(gcc -dumpfullversion)
        # Overlay patched MUST package
        # TODO remove once upstreamed
        BUILTIN_REPO=$(spack location --repo builtin)
        mkdir -p "${BUILTIN_REPO}/packages/must"
        curl -fsSL https://raw.githubusercontent.com/freifrauvonbleifrei/spack-packages/update_must_package/repos/spack_repo/builtin/packages/must/package.py \
          -o "${BUILTIN_REPO}/packages/must/package.py"
        spack config add "concretizer:unify:false"
        spack env create ddc-env
        spack --env ddc-env add ddc@main -splines -fft -pdi #...+cuda cuda_arch=...
        spack --env ddc-env add py-pip  # for postprocessing
        spack --env ddc-env add googletest
        if [ "${{ matrix.mpi }}" == "yes" ]; then
          spack --env ddc-env add mpi
          spack --env ddc-env add must
        fi
        spack --env ddc-env add py-pip
        echo "=== Concretized specs ==="
        spack --env ddc-env concretize 2>&1
        echo "=== Must spec details ==="
        spack --env ddc-env find -lv must 2>&1 || true
        echo "=== Compiler info ==="
        spack compiler list 2>&1
        spack compiler info gcc 2>&1 || true
        echo "=== packages.yaml gcc entries ==="
        spack config blame packages 2>&1 | grep -A10 'gcc@' | head -30
        echo "=== Installing ==="
        spack --env ddc-env install --show-log-on-error
        spack env activate ddc-env
        spack env status
    - name: Build with CMake
      shell: spack-bash {0}
      run: |
        spack env activate ddc-env
        mkdir build
        ls -l
        if [ "${{ matrix.mpi }}" == "yes" ]; then
          cmake -DPALIWA_BUILD_TESTS=ON -DPALIWA_WITH_MPI=ON -B build
        else
          cmake -DPALIWA_BUILD_TESTS=ON -DPALIWA_WITH_MPI=OFF -B build
        fi
        cmake --build ./build/ --config ${{ matrix.build_type }}
    - name: Run tests (serial)
      shell: spack-bash {0}
      run: |
        spack env activate ddc-env
        export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
        cd build
        if [ "${{ matrix.mpi }}" == "yes" ]; then
          mpiexec --oversubscribe -n 1 ./test/paliwa_tests --gtest_filter='-distributed*'
        else
          ./test/paliwa_tests
        fi
    - name: Run distributed tests (MPI only)
      if: matrix.mpi == 'yes'
      shell: spack-bash {0}
      run: |
        spack env activate ddc-env
        export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
        cd build
        mpiexec --oversubscribe -n 2 ./test/paliwa_tests --gtest_filter='distributed.classify*:distributed.roundtrip_1d*'
        mpiexec --oversubscribe -n 4 ./test/paliwa_tests --gtest_filter='distributed.roundtrip_2d*'
        mpiexec --oversubscribe -n 4 ./test/paliwa_tests --gtest_filter='combination_technique.distributed*'
        mpiexec --oversubscribe -n 8 ./test/paliwa_tests --gtest_filter='distributed.roundtrip_1d_8ranks*'
    - name: Run MUST correctness checks (MPI only)
      if: matrix.mpi == 'yes' && matrix.build_type == 'Release'
      shell: spack-bash {0}
      run: |
        spack env activate ddc-env
        export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
        cd build
        export OMPI_MCA_rmaps_base_oversubscribe=1
        mkdir -p must_reports
        spack build-env must -- mustrun --must:mpiexec "mpiexec" --must:np "-n" -n 2 \
          ./test/paliwa_tests --gtest_filter='distributed.roundtrip_1d_hat'
        grep -q "no MPI usage errors" MUST_Output.html
        mv MUST_Output.html must_reports/roundtrip_1d_hat.html
        spack build-env must -- mustrun --must:mpiexec "mpiexec" --must:np "-n" -n 4 \
          ./test/paliwa_tests --gtest_filter='distributed.roundtrip_2d_all_wavelets'
        grep -q "no MPI usage errors" MUST_Output.html
        mv MUST_Output.html must_reports/roundtrip_2d.html
        spack build-env must -- mustrun --must:mpiexec "mpiexec" --must:np "-n" -n 4 \
          ./test/paliwa_tests --gtest_filter='combination_technique.distributed_2d'
        grep -q "no MPI usage errors" MUST_Output.html
        mv MUST_Output.html must_reports/combination_technique_2d.html
        echo "MUST: all checks passed"
    - name: Upload MUST reports
      if: matrix.mpi == 'yes' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: must-reports
        path: build/must_reports/
    - name: Postprocess combination technique results
      if: matrix.mpi == 'yes' && matrix.build_type == 'Release'
      shell: spack-bash {0}
      run: |
        spack env activate ddc-env
        export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
        cd build
        # Generate serial raw files
        mpiexec --oversubscribe -n 1 ./test/paliwa_tests --gtest_filter='combination_technique.full_integration_2d'
        # Generate distributed raw files
        mpiexec --oversubscribe -n 4 ./test/paliwa_tests --gtest_filter='combination_technique.distributed_2d'
        # Visualize
        pip install matplotlib numpy
        python3 ../paliwa/postprocess.py
        python3 ../paliwa/postprocess.py --distributed 2 2
    - name: Upload combination technique plots
      if: matrix.mpi == 'yes' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: combination-technique-plots
        path: |
          build/combination_scheme.png
          build/combination_scheme_distributed.png
